name: Release branches

# Snapshot-style release branches.
#
# On every push to `tests` or `main`, this workflow builds each package and
# force-pushes its self-contained contents (src/ + dist/ + package.json + ...)
# to a single-commit "release-<package>-<source-branch>" branch where the
# package is at the repository root. Consumers install via the native yarn 1
# git-URL syntax that does not require any third-party tarball service:
#
#   "@cofferdam/sdk":       "github:OffshoreSync/cofferdam-sdk#release-core-tests"
#   "@cofferdam/sdk-react": "github:OffshoreSync/cofferdam-sdk#release-react-tests"
#
# This is what the broader subtree-split family of patterns produces in
# practice — minus the history preservation, which consumers do not consume.
# Each release branch has exactly one commit, force-pushed every time the
# source branch moves; `yarn install` always sees a clean tarball.
#
# Promotion model:
#   tests  ─push→  release-core-tests  + release-react-tests   (α-1, fast-moving)
#   main   ─push→  release-core-main   + release-react-main    (stable, prod-eligible)

on:
  push:
    branches: [tests, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One in-flight run per (workflow, source-branch). Cancel any older run that
  # is still building when a newer commit arrives — we only care about the
  # latest snapshot.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, react]

    env:
      SOURCE_REF: ${{ github.ref_name }}        # tests | main
      PKG: ${{ matrix.package }}                 # core | react
      RELEASE_BRANCH: release-${{ matrix.package }}-${{ github.ref_name }}

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24 LTS (matches .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack (yarn classic from packageManager-style root)
        run: |
          corepack enable
          yarn --version

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck and test (gate the release on a green build)
        run: |
          yarn typecheck
          yarn test --run

      - name: Build all packages (regenerate dist/)
        run: yarn build

      - name: Stage release contents into a clean directory
        # We copy only what consumers need: the package's source, its built
        # dist/, its package.json, the LICENSE, and a placeholder README.
        # node_modules and tsbuildinfo files are explicitly excluded.
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage-$PKG"
          mkdir -p "$STAGE"
          rsync -a \
            --exclude='node_modules/' \
            --exclude='*.tsbuildinfo' \
            --exclude='test/' \
            "packages/$PKG/" "$STAGE/"
          cp LICENSE "$STAGE/LICENSE" || true
          # If the package does not ship its own README, fall back to the
          # monorepo README so the release branch is browseable on GitHub.
          if [ ! -f "$STAGE/README.md" ]; then
            cp README.md "$STAGE/README.md"
          fi
          echo "Staged contents:"
          ls -la "$STAGE"

      - name: Force-push staged contents to release branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage-$PKG"
          WORK="$RUNNER_TEMP/work-$PKG"

          # Initialize a fresh git repo from the staged contents and force-push
          # it as a single commit to the release branch. This is functionally
          # equivalent to `git subtree split` for the consumer's POV but is
          # simpler and always reflects the just-built dist/.
          git -C "$STAGE" init -q -b "$RELEASE_BRANCH"
          git -C "$STAGE" add -A
          git -C "$STAGE" commit -q -m "release: $PKG @ $SOURCE_REF ($GITHUB_SHA)"
          git -C "$STAGE" remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git -C "$STAGE" push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - name: Summary
        run: |
          echo "::notice title=Released $PKG::Pushed snapshot of packages/$PKG @ $SOURCE_REF to refs/heads/$RELEASE_BRANCH"
          echo "Consumers install via:"
          echo "  yarn add github:${{ github.repository }}#$RELEASE_BRANCH"
